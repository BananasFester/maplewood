# Builds the game and publishes the release build (dist/release: index.html + music/) to GitHub Pages.
# Runs on every push to main, or by hand from the Actions tab.
# One-time setup: repo Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest already has python3 and node, which is all build.sh needs
      - name: Build
        run: sh build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/release
      - id: deployment
        uses: actions/deploy-pages@v4
